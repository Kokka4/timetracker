<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local Time Tracker</title>
<style>
  /* Dark by choice rather than by system preference: this is a readout on a
     background process, sitting over whatever page you were already on. A
     fixed dark surface reads as instrumentation instead of as part of it. */
  :root {
    color-scheme: dark;
    --bg:        #0b0d12;
    --card:      #141922;
    --card-2:    #1a212c;
    --line:      #232c3a;
    --line-soft: #1b2230;
    --ink:       #eaeff6;
    --ink-2:     #94a2b6;
    --muted:     #5c6a7e;
    --accent:    #4d9dff;
    --live:      #2fe3a8;
    --bad:       #ff6161;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --r:  14px;
    --r2: 10px;
  }

  * { box-sizing: border-box; }

  body {
    width: 330px;
    margin: 0;
    padding: 14px;
    background:
      radial-gradient(130% 60% at 50% -10%, rgba(77, 157, 255, 0.11), transparent 70%),
      var(--bg);
    color: var(--ink);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .head h1 {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .spacer { margin-left: auto; }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok  { background: var(--live); box-shadow: 0 0 0 3px rgba(47,227,168,0.16); }
  .dot.bad { background: var(--bad);  box-shadow: 0 0 0 3px rgba(255,97,97,0.15); }

  .eyebrow {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .today {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    margin-top: 3px;
  }
  .sub { margin-top: 5px; color: var(--ink-2); font-size: 11.5px; min-height: 16px; }
  .sub .err { color: var(--bad); }

  /* -- the card for what is in front right now ------------------------- */

  .card {
    margin-top: 14px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--card);
  }
  .card[hidden] { display: none; }

  .now-head { display: flex; align-items: baseline; gap: 8px; }
  .now-timer {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    color: var(--live);
  }
  .now-what {
    margin-top: 7px;
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .now-meta {
    margin-top: 2px;
    font-size: 11px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 11px; }

  input[type=text], select {
    width: 100%;
    font: inherit;
    font-size: 12px;
    padding: 8px 9px;
    border: 1px solid var(--line);
    border-radius: var(--r2);
    background: var(--card-2);
    color: var(--ink);
    appearance: none;
  }
  input[type=text]::placeholder { color: var(--muted); }
  input[type=text]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  select { margin-top: 7px; cursor: pointer; }
  #endpoint { font-family: var(--mono); font-size: 10px; color: var(--ink-2); }

  /* -- buttons ---------------------------------------------------------- */

  button {
    font: inherit;
    font-size: 12.5px;
    padding: 9px 13px;
    border-radius: var(--r2);
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: background 90ms ease, border-color 90ms ease, opacity 90ms ease;
  }
  button:hover:not(:disabled) { background: var(--card-2); border-color: #2d3848; }
  button:active:not(:disabled) { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .wide { width: 100%; margin-top: 8px; }
  .primary {
    background: var(--accent);
    border-color: transparent;
    color: #04121f;
    font-weight: 650;
  }
  .primary:hover:not(:disabled) { background: #69acff; border-color: transparent; }
  .resume {
    background: var(--live);
    border-color: transparent;
    color: #042219;
    font-weight: 650;
  }
  .resume:hover:not(:disabled) { background: #4ef0bb; border-color: transparent; }
  .resume[hidden] { display: none; }

  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row > button { flex: 1; }
  .row[hidden] { display: none; }

  .pause-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 7px; }
  .pause-row button { padding: 8px 0; text-align: center; font-size: 12px; }
  .pause-row button:last-child { grid-column: 1 / -1; color: var(--ink-2); }
  .pause-row[hidden] { display: none; }

  .label-block { margin-top: 16px; }
  .label-block[hidden] { display: none; }
  .eyebrow[hidden] { display: none; }

  /* -- states ----------------------------------------------------------- */

  .banner {
    display: none;
    margin-top: 12px;
    padding: 11px 12px;
    border: 1px solid rgba(255,97,97,0.36);
    border-left: 3px solid var(--bad);
    border-radius: var(--r2);
    background: rgba(255,97,97,0.09);
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--ink-2);
  }
  .banner.on { display: block; }
  .banner b { color: var(--bad); }
  .banner code {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink);
  }

  /* Collapses when there is nothing to say, rather than reserving a line of
     empty space under the button for the whole time you are not labelling. */
  .ok-flash {
    margin-top: 9px;
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--live);
  }
  .ok-flash:empty { display: none; }

  /* The second step. It appears only after something has been assigned, and
     it is the one place in the popup that asks rather than tells, so it is
     set apart from the card above it rather than continuing it. */
  .rule-offer {
    margin-top: 13px;
    padding: 12px 12px 13px;
    border: 1px solid var(--line);
    border-radius: var(--r2);
    background: var(--card-2);
  }
  .rule-offer[hidden] { display: none; }
  .offer-text {
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-2);
  }
  .offer-text b { color: var(--ink); font-weight: 600; }
  .rule-offer select { margin-top: 10px; width: 100%; }
  .offer-actions {
    display: flex;
    gap: 7px;
    margin-top: 10px;
  }
  .offer-actions .primary { flex: 1; }
  .quiet {
    font: inherit;
    font-size: 12px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .quiet:hover { color: var(--ink); border-color: var(--muted); }

  .note {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid var(--line-soft);
    color: var(--muted);
    font-size: 10.5px;
    line-height: 1.5;
  }
  details.more > summary {
    margin-top: 14px;
    font-size: 10.5px;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
  }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary:hover { color: var(--ink-2); }
  details.more label {
    display: block;
    margin: 10px 0 6px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .off .today { color: var(--muted); }
</style>
</head>
<body>
  <div class="head">
    <span class="dot" id="dot"></span>
    <h1>Local Time Tracker</h1>
    <span class="spacer"></span>
    <button class="resume" id="resume" hidden>Resume</button>
  </div>

  <div class="banner" id="banner">
    <b id="banner-title">Tracking is off.</b> <span id="banner-detail"></span>
  </div>

  <div class="eyebrow">Today</div>
  <div class="today" id="today">&mdash;</div>
  <div class="sub" id="state">checking&hellip;</div>

  <div class="card" id="now" hidden>
    <div class="now-head">
      <span class="eyebrow">Now tracking</span>
      <span class="now-timer" id="now-timer">0:00</span>
    </div>
    <div class="now-what" id="now-what"></div>
    <div class="now-meta" id="now-meta"></div>

    <div class="label-block" id="label-block">
      <div class="fields">
        <input type="text" id="category" list="categories" placeholder="category" autocomplete="off">
        <input type="text" id="client" list="clients" placeholder="client" autocomplete="off">
      </div>
      <button class="primary wide" id="label">Assign this time</button>
      <div class="ok-flash" id="flash"></div>
    </div>

    <!-- Assigning and rule-making used to be the same press, which meant
         labelling one afternoon quietly changed how every future afternoon
         was read. They are two steps now: the time is assigned, and then
         you are asked, with the page and the labels named, whether it
         should happen again by itself. -->
    <div class="rule-offer" id="rule-offer" hidden>
      <div class="offer-text" id="offer-text"></div>
      <select id="scope" aria-label="How far the rule should reach"></select>
      <div class="offer-actions">
        <button class="primary" id="make-rule">Make the rule</button>
        <button class="quiet" id="no-rule">Just this once</button>
      </div>
      <div class="ok-flash" id="offer-flash"></div>
    </div>
  </div>

  <div class="row" id="actions">
    <button class="primary" id="open">Open dashboard</button>
  </div>

  <span class="eyebrow" id="pause-label" style="display:block;margin-top:16px">Stop recording for</span>
  <div class="pause-row" id="pause-row">
    <button data-minutes="30">30 min</button>
    <button data-minutes="60">1 h</button>
    <button data-minutes="120">2 h</button>
    <button data-minutes="">Until I turn it back on</button>
  </div>

  <details class="more">
    <summary>Settings</summary>
    <label for="endpoint">Tracker endpoint</label>
    <input type="text" id="endpoint" spellcheck="false" autocomplete="off">
    <div class="note">Tab titles and URLs go to that address and nowhere else.
      Incognito windows are never reported.</div>
  </details>

  <datalist id="clients"></datalist>
  <datalist id="categories"></datalist>
</body>
<script src="popup.js"></script>
</html>
