<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local Time Tracker</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --ring: rgba(11, 11, 11, 0.12);
    --good: #0ca30c;
    --critical: #d03b3b;
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19;
      --ink-1: #f0efec;
      --ink-2: #c3c2b7;
      --ring: rgba(255, 255, 255, 0.14);
      --accent: #3987e5;
    }
  }
  body {
    width: 290px;
    margin: 0;
    padding: 14px;
    background: var(--surface);
    color: var(--ink-1);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0 0 10px; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--good); }
  .dot.bad { background: var(--critical); }
  .today { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 11px; text-transform: uppercase;
          letter-spacing: 0.05em; color: var(--muted); margin: 12px 0 4px; }
  input[type=text] {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 12px;
    padding: 5px 7px; border: 1px solid var(--ring); border-radius: 6px;
    background: transparent; color: var(--ink-1);
  }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  button {
    font: inherit; font-size: 12px; padding: 6px 11px; border-radius: 7px;
    border: 1px solid var(--ring); background: transparent; color: var(--ink-1);
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
  button.resume { background: var(--good); border-color: transparent; color: #fff; font-weight: 600; }
  .pause-row { display: flex; gap: 6px; margin-top: 6px; }
  .pause-row button { flex: 1; padding: 6px 0; text-align: center; }
  /* An explicit `display` beats the browser's own [hidden] rule, so any
     element given one here has to opt back in or the hidden attribute
     silently does nothing. */
  .pause-row[hidden], label[hidden] { display: none; }
  .note { margin-top: 12px; color: var(--muted); font-size: 11.5px; }
  .err { color: var(--critical); }
  .banner {
    display: none; margin: 0 0 12px; padding: 9px 10px; border-radius: 8px;
    background: rgba(208, 59, 59, 0.12); border: 1px solid rgba(208, 59, 59, 0.4);
    font-size: 12px; line-height: 1.4;
  }
  .banner.on { display: block; }
  .banner b { color: var(--critical); }
  .off .today { opacity: 0.35; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> Local Time Tracker</h1>

  <div class="banner" id="banner">
    <b>Tracking is off.</b> <span id="banner-detail"></span>
  </div>

  <div class="today" id="today">&mdash;</div>
  <div class="sub" id="state">checking&hellip;</div>

  <div class="row">
    <button class="primary" id="open">Open dashboard</button>
    <button class="resume" id="resume" hidden>Resume tracking</button>
  </div>

  <label id="pause-label">Stop recording for</label>
  <div class="pause-row" id="pause-row">
    <button data-minutes="30">30 min</button>
    <button data-minutes="60">1 h</button>
    <button data-minutes="120">2 h</button>
    <button data-minutes="">Until I resume</button>
  </div>

  <label for="endpoint">Tracker endpoint</label>
  <input type="text" id="endpoint" spellcheck="false" autocomplete="off">

  <div class="note" id="note">Tab titles and URLs are posted to that address
    and nowhere else. Incognito windows are never reported.</div>
</body>
<script src="popup.js"></script>
</html>
